[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forelius"
version = "0.1.0"
description = "LLM-assisted civil-engineering report writing and rendering with a simple Python API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "baml-py>=0.222.0",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
include = ["forelius*", "baml_client*"]
exclude = ["baml_src*", "tests*"]
